name: selfhost-build

# Self-host release builds for the fresh-upstream migration branch (fork-only).
#
# Produces, without deploying anything:
#   * backend + pusher runtime images on GHCR, tagged only with the commit SHA,
#     each import-smoked with upstream's runtime_image_contracts.py before push;
#   * a release-signed dev APK (historical self-host key) + latest.json for the
#     authenticated update feed.
# Deployment to the canary is a separate, manual, digest-pinned step.
#
# Only the fork's own secrets are used: the Android signing key and the dev
# Firebase/client config. No cloud deploy credentials exist in this repository.
on:
  push:
    branches: [migration/upstream-selfhost-v2]
    paths:
      - 'backend/**'
      - 'app/**'
      - '.github/workflows/selfhost-build.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'HTTPS self-host API base URL compiled into the app'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: selfhost-build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Upstream's default base image is private; the public slim image is the
  # historical self-host base.
  PYTHON_BASE_IMAGE: python:3.11-slim
  # Canary endpoint unless a repository variable or dispatch input overrides it.
  API_BASE_URL: ${{ inputs.api_base_url || vars.OMI_SELFHOST_API_BASE_URL || 'https://35.239.109.236.sslip.io/' }}

jobs:
  images:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            repository: ghcr.io/cybervoid/omi-backend
          - name: pusher
            dockerfile: backend/pusher/Dockerfile
            repository: ghcr.io/cybervoid/omi-pusher
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ matrix.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=selfhost-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=selfhost-${{ matrix.name }}

      - name: Smoke image (upstream source-closure + import contract)
        run: |
          set -euo pipefail
          python3 -m pip install -q pyyaml
          python3 backend/scripts/runtime_image_contracts.py smoke \
            --dockerfile "${{ matrix.dockerfile }}" \
            --image "${{ matrix.repository }}:sha-${{ github.sha }}"

      - name: Verify self-host STT opt-in is present
        if: matrix.name == 'backend'
        run: |
          docker run --rm --entrypoint python "${{ matrix.repository }}:sha-${{ github.sha }}" -c \
            "from config.stt_provider_policy import SELFHOST_DEEPGRAM_ENV, selfhost_deepgram_enabled; assert SELFHOST_DEEPGRAM_ENV == 'OMI_SELFHOST_DEEPGRAM'; print('selfhost opt-in present')"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and record digest
        run: |
          set -euo pipefail
          image="${{ matrix.repository }}:sha-${{ github.sha }}"
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "unresolved digest" >&2; exit 1; }
          echo "${{ matrix.name }} ${image%%:*}@${digest}" | tee "image-${{ matrix.name }}.txt"
          echo "- \`${{ matrix.name }}\`: \`${image%%:*}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: image-${{ matrix.name }}.txt
          retention-days: 30

  android:
    name: Release-signed dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: "28.2.13676358"
      # Strictly newer than every historical self-host build (last: 1015), so
      # both `adb install -r` and the in-app updater treat it as an upgrade.
      VERSION_CODE_OFFSET: "1000"
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Install pinned Android NDK
        run: python3 .github/scripts/install_android_ndk.py --ndk-version "$NDK_VERSION"

      - name: Inject signing key and dev client config (secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          FIREBASE_OPTIONS_DEV: ${{ secrets.FIREBASE_OPTIONS_DEV }}
          DEV_ENV: ${{ secrets.DEV_ENV }}
        run: |
          set -euo pipefail
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omi-release.jks"
          mkdir -p app/android/app/src/dev app/android/app/src/prod
          echo "$GOOGLE_SERVICES_JSON_DEV" | base64 -d > app/android/app/src/dev/google-services.json
          echo "$FIREBASE_OPTIONS_DEV" | base64 -d > app/lib/firebase_options_dev.dart
          # The dev build imports both option files; prod only has to compile.
          cp app/lib/firebase_options_dev.dart app/lib/firebase_options_prod.dart
          echo "$DEV_ENV" | base64 -d > app/.dev.env
          : > app/.env

      - name: Derive version
        working-directory: app
        run: |
          set -euo pipefail
          line="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          echo "VERSION_NAME=${line%%+*}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${line##*+} + VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"

      - name: Build release-signed dev APK (arm64)
        working-directory: app
        env:
          OMI_SELFHOST_RELEASE_SIGNING: 'true'
          CM_KEYSTORE_PATH: ${{ runner.temp }}/omi-release.jks
          CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$API_BASE_URL" == https://* ]] || { echo "API_BASE_URL must be HTTPS" >&2; exit 1; }
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release --flavor dev --target-platform android-arm64 \
            --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
            --dart-define=OMI_SELF_HOSTED_REMOTE=true \
            --dart-define=OMI_API_BASE_URL="$API_BASE_URL"

      - name: Verify signer, package, and version
        working-directory: app
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-dev-release.apk
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apksigner.txt"
          grep -E '^Verified using|certificate SHA-256 digest' "$RUNNER_TEMP/apksigner.txt"
          # Every signer line (v2/v3 labels differ) must be the historical self-host
          # release key; same-signature upgrades depend on it.
          expected='89641cc6ec1b717c29cdb1d43fb4a0b5c8fdaa81b2e02777930569bb192adf7e'
          digests="$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' "$RUNNER_TEMP/apksigner.txt" | awk '{print $NF}' | sort -u)"
          [[ "$digests" == "$expected" ]] || { echo "APK signer digests: ${digests:-none}; expected $expected" >&2; exit 1; }
          badging="$("$bt/aapt2" dump badging "$apk" | head -1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.friend.ios.dev'" || { echo "unexpected package" >&2; exit 1; }
          echo "$badging" | grep -q "versionCode='${VERSION_CODE}'" || { echo "unexpected versionCode" >&2; exit 1; }

      - name: Generate update metadata
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          set -euo pipefail
          apk=app-dev-release.apk
          python3 - "$apk" <<'PY'
          import hashlib, json, os, sys, datetime
          apk = sys.argv[1]
          digest = hashlib.sha256(open(apk, 'rb').read()).hexdigest()
          meta = {
              'app': 'Omi Dev',
              'package': 'com.friend.ios.dev',
              'versionName': os.environ['VERSION_NAME'],
              'versionCode': int(os.environ['VERSION_CODE']),
              'sha256': digest,
              'sizeBytes': os.path.getsize(apk),
              'generatedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'commit': os.environ['GITHUB_SHA'],
              'source': f"{os.environ['GITHUB_REPOSITORY']} selfhost-build run {os.environ['GITHUB_RUN_ID']}",
          }
          json.dump(meta, open('latest.json', 'w'), indent=2)
          print(json.dumps(meta, indent=2))
          PY
          {
            echo "- APK \`${VERSION_NAME} (${VERSION_CODE})\` for \`${API_BASE_URL}\`"
            echo "- SHA-256 \`$(sha256sum "$apk" | awk '{print $1}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: omi-dev-release-apk
          path: |
            app/build/app/outputs/flutter-apk/app-dev-release.apk
            app/build/app/outputs/flutter-apk/latest.json
          retention-days: 7
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/omi-release.jks" app/android/app/src/dev/google-services.json app/.dev.env
