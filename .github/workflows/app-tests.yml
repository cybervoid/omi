name: App Flutter Tests

# Runs the Flutter unit/widget test suite for the self-host app.
# app/test.sh self-provisions placeholder Firebase config + build_runner output, so
# NO secrets are needed (the tests don't hit the real backend or sign the app).
# Mirrors build-app.yml's Flutter toolchain. Complements backend-unit-tests.yml.
on:
  push:
    branches: [selfhost]
    paths:
      - 'app/**'
      - '.github/workflows/app-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-tests:
    name: Flutter test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Run app test suite (config + build_runner + flutter test)
        run: bash test.sh
