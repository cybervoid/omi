name: build-diarizer

on:
  push:
    branches: [ selfhost ]
    paths:
      - 'selfhost/diarizer/**'
      - '.github/workflows/build-diarizer.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-diarizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push diarizer image
        uses: docker/build-push-action@v6
        with:
          context: selfhost/diarizer
          file: selfhost/diarizer/Dockerfile.cloudrun
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cybervoid/omi-diarizer:latest
            ghcr.io/cybervoid/omi-diarizer:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
