name: upstream-sync

# Daily + manual upstream reconciliation for the patched `selfhost` fork.
# If `selfhost` is behind BasedHardware/omi it ATTEMPTS a rebase onto the upstream
# ref on a throwaway `upstream-sync/<upstream-sha>` branch (never touching selfhost):
#   * clean rebase + backend compiles -> push the candidate, open an issue with the
#     diff and a one-shot "land" (force-update) command;
#   * conflicts / broken compile      -> open an issue for a manual rebase, push nothing.
# A human still reviews + force-updates `selfhost` (deploy/RUNBOOK.md §4a) — we prepare
# and test the rebase automatically, but never auto-ship upstream into production.
on:
  schedule:
    - cron: '0 9 * * *'   # daily 09:00 UTC
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream branch or tag to rebase onto'
        default: main
        required: false

permissions:
  contents: write   # push the upstream-sync/* candidate branch
  issues: write     # open/update the tracking issue

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'main' }}
      GIT_EDITOR: 'true'
      GIT_SEQUENCE_EDITOR: 'true'
    steps:
      - name: Checkout selfhost (full history)
        uses: actions/checkout@v4
        with:
          ref: selfhost
          fetch-depth: 0

      - name: Rebase onto upstream, test, and report
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -uo pipefail   # NOT -e: rebase/compile/push failures are handled explicitly

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/BasedHardware/omi.git
          git fetch --quiet upstream "$UPSTREAM_REF" || { echo "::error::fetch upstream/$UPSTREAM_REF failed"; exit 1; }

          TARGET="$(git rev-parse FETCH_HEAD)"
          BASE="$(git merge-base HEAD "$TARGET")"
          AHEAD="$(git rev-list --count "${BASE}..${TARGET}")"
          echo "upstream/$UPSTREAM_REF (${TARGET:0:12}) is ${AHEAD} commit(s) ahead of our base (${BASE:0:12})."
          if [ "$AHEAD" -eq 0 ]; then
            echo "### upstream-sync: \`selfhost\` is up to date with upstream/$UPSTREAM_REF ✅" >> "$GITHUB_STEP_SUMMARY"
            # caught up — close any lingering open "Upstream sync" issues
            if [ "$(gh repo view "$REPO" --json hasIssuesEnabled --jq .hasIssuesEnabled 2>/dev/null)" = "true" ]; then
              for OLD in $(gh issue list --repo "$REPO" --state open --search "Upstream sync in:title" --json number --jq '.[].number' 2>/dev/null); do
                gh issue close "$OLD" --repo "$REPO" --comment "\`selfhost\` is now up to date with upstream/${UPSTREAM_REF}; closing." || true
              done
            fi
            echo "Up to date; nothing to do."; exit 0
          fi

          SHORT="$(git rev-parse --short "$TARGET")"
          CAND="upstream-sync/${SHORT}"
          git log --no-merges --pretty='- %h %s' "${BASE}..${TARGET}" | head -40 > commits.txt || true

          # --- attempt the rebase on a throwaway candidate branch (selfhost is untouched) ---
          git checkout -B "$CAND" selfhost
          if git rebase "$TARGET"; then
            STATUS=clean
            python3 -m compileall -q backend || STATUS=compile_failed
          else
            STATUS=conflict
            git diff --name-only --diff-filter=U | sed 's/^/    /' | head -50 > conflicts.txt || true
            git rebase --abort || true
          fi
          echo "rebase status: $STATUS"

          # --- optionally push the candidate branch. The built-in GITHUB_TOKEN cannot push
          #     commits that touch .github/workflows, so pushing needs a workflow-scoped PAT
          #     in secrets.SYNC_PAT; without it we report-only and the human lands locally. ---
          PUSHED=0
          if [ "$STATUS" != conflict ] && [ -n "${SYNC_PAT:-}" ]; then
            if git push -f "https://x-access-token:${SYNC_PAT}@github.com/${REPO}.git" "HEAD:refs/heads/${CAND}"; then
              PUSHED=1
            else
              echo "::warning::could not push candidate ${CAND} (SYNC_PAT needs Contents+Workflows write)"
            fi
          fi

          # --- report: job summary always; issue only if the repo has issues enabled ---
          COMPARE="https://github.com/${REPO}/compare/selfhost...${CAND}"
          TITLE="Upstream sync ${SHORT} — ${AHEAD} behind"
          {
            if [ "$STATUS" = conflict ]; then
              echo "## ⚠️ Upstream sync — manual rebase needed"
              echo "Upstream **BasedHardware/omi** \`${UPSTREAM_REF}\` is **${AHEAD}** commit(s) ahead; the automatic rebase **hit conflicts**."
              echo; echo "**Conflicting files:**"; echo '```'; cat conflicts.txt 2>/dev/null; echo '```'
            elif [ "$STATUS" = compile_failed ]; then
              echo "## ⚠️ Upstream sync — clean rebase, but backend compile FAILED"
              echo "Upstream \`${UPSTREAM_REF}\` is **${AHEAD}** ahead; rebase was clean but backend \`compileall\` **FAILED ❌** — review before landing."
            else
              echo "## ✅ Upstream sync — clean rebase"
              echo "Upstream \`${UPSTREAM_REF}\` is **${AHEAD}** commit(s) ahead; automatic rebase was clean and backend \`compileall\` passed ✅."
            fi
            [ "$PUSHED" = 1 ] && { echo; echo "Candidate branch \`${CAND}\` pushed — [review the diff](${COMPARE})."; }
            echo; echo "### Land it (rebase model — force-updates \`selfhost\`, per RUNBOOK §4a)"
            if [ "$PUSHED" = 1 ]; then
              echo "The rebase is already prepared on \`${CAND}\`:"
              echo '```bash'
              echo "git fetch origin && git branch -f selfhost origin/${CAND} && git push --force-with-lease origin selfhost"
              echo '```'
            else
              echo "Run locally (your credentials carry the \`workflow\` scope the CI token lacks):"
              echo '```bash'
              echo "git fetch upstream && git checkout selfhost && git rebase ${TARGET}   # resolve conflicts if any"
              echo "git push --force-with-lease origin selfhost"
              echo '```'
            fi
            echo "That push triggers build-backend + build-app; the VM image + app-feed reconcilers then converge automatically."
            echo; echo "**Upstream commits (newest first, up to 40):**"; cat commits.txt 2>/dev/null
          } | tee body.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$(gh repo view "$REPO" --json hasIssuesEnabled --jq .hasIssuesEnabled 2>/dev/null)" = "true" ]; then
            NUM="$(gh issue list --repo "$REPO" --state open --search "Upstream sync ${SHORT} in:title" --json number --jq '.[0].number // empty' 2>/dev/null)"
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --repo "$REPO" --title "$TITLE" --body-file body.md || true
            else
              # supersede: close open issues for older upstream tips before opening the new one
              for OLD in $(gh issue list --repo "$REPO" --state open --search "Upstream sync in:title" --json number --jq '.[].number' 2>/dev/null); do
                gh issue close "$OLD" --repo "$REPO" --comment "Superseded by a newer upstream tip (${SHORT})." || true
              done
              ASSIGN=""; [ -n "${GITHUB_REPOSITORY_OWNER:-}" ] && ASSIGN="--assignee ${GITHUB_REPOSITORY_OWNER}"
              gh issue create --repo "$REPO" --title "$TITLE" --body-file body.md $ASSIGN || true
            fi
          else
            echo "Issues disabled on ${REPO}; the report is in this run's job summary only."
          fi
