name: upstream-sync

# Weekly notifier: if BasedHardware/omi `main` has advanced past our `selfhost` base,
# open (or skip if one is already open) a tracking issue. Rebase is done manually
# per deploy/RUNBOOK.md so the 0001/0002 patch conflicts get human review.
on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selfhost
        uses: actions/checkout@v4
        with:
          ref: selfhost
          fetch-depth: 0

      - name: Compare with upstream and open a sync issue if behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/BasedHardware/omi.git
          git fetch --quiet upstream main
          BASE="$(git merge-base HEAD upstream/main)"
          AHEAD="$(git rev-list --count "${BASE}..upstream/main")"
          echo "Upstream main is ${AHEAD} commit(s) ahead of our selfhost base (${BASE})."
          if [ "${AHEAD}" -eq 0 ]; then
            echo "Up to date. Nothing to do."
            exit 0
          fi
          OPEN="$(gh issue list --state open --search 'in:title Upstream omi is ahead' --json number --jq 'length')"
          if [ "${OPEN}" != "0" ]; then
            echo "An open sync issue already exists; skipping."
            exit 0
          fi
          LATEST="$(git log -1 --format='%h %s' upstream/main)"
          {
            echo "Upstream **BasedHardware/omi** \`main\` is **${AHEAD}** commit(s) ahead of this fork's \`selfhost\` base."
            echo ""
            echo "Latest upstream commit: \`${LATEST}\`"
            echo ""
            echo "To sync, follow \`deploy/RUNBOOK.md\` §4: fetch \`upstream\`, rebase \`selfhost\` onto the new commit/tag, resolve any conflicts in patches 0001/0002, push, and let \`build-backend\` rebuild the image."
            echo ""
            echo "_Auto-generated by .github/workflows/upstream-sync.yml._"
          } > body.md
          gh issue create --title "Upstream omi is ahead — time to sync" --body-file body.md
