name: build-app

# Builds a release-SIGNED dev APK for the self-hosted setup and uploads it + latest.json as
# workflow artifacts. Manual only (app builds are heavy). The signing keystore + your dev Firebase
# config are injected from Actions secrets at build time — nothing sensitive is committed.
#
# NOTE: on a public repo, workflow artifacts are broadly downloadable. The dev APK is low-risk
# (Firebase key is package+SHA-restricted and the backend is auth-gated), but for true privacy the
# delivery step can be moved to a private GCS bucket (via Workload Identity Federation) or the VM.
on:
  workflow_dispatch:
  push:
    branches: [selfhost]
    paths:
      - 'app/**'
      - '.github/workflows/build-app.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # flutter_contacts ^2.3.1 needs Dart ^3.12 (Flutter 3.47+). 3.35.3 fails pub get.
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Set up Android SDK (cmdline-tools on PATH)
        uses: android-actions/setup-android@v3

      - name: Install required Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Inject signing keystore + dev Firebase config (from secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          FIREBASE_OPTIONS_DEV: ${{ secrets.FIREBASE_OPTIONS_DEV }}
          DEV_ENV: ${{ secrets.DEV_ENV }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omi-release.jks"
          mkdir -p app/android/app/src/dev
          echo "$GOOGLE_SERVICES_JSON_DEV" | base64 -d > app/android/app/src/dev/google-services.json
          echo "$FIREBASE_OPTIONS_DEV" | base64 -d > app/lib/firebase_options_dev.dart
          # dev flavor imports both; prod is a dev-stub so the dev build compiles
          cp app/lib/firebase_options_dev.dart app/lib/firebase_options_prod.dart
          echo "$DEV_ENV" | base64 -d > app/.dev.env

      - name: Derive version from pubspec
        working-directory: app
        run: |
          set -euo pipefail
          # pubspec `version:` is `<name>+<code>` (e.g. 1.0.538+900). Add the run
          # number to the base code so every self-host build is strictly newer
          # than the last, which is what the in-app updater compares.
          VERSION_LINE="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          BASE_CODE="${VERSION_LINE##*+}"
          VERSION_CODE="$((BASE_CODE + GITHUB_RUN_NUMBER))"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Derived versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Build signed dev APK
        working-directory: app
        env:
          CM_KEYSTORE_PATH: ${{ runner.temp }}/omi-release.jks
          CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n || true
          flutter build apk --flavor dev --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"

      - name: Verify APK signature
        working-directory: app
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-dev-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | grep -iE 'Signer|SHA-1|SHA-256' || true
      - name: Generate update metadata
        working-directory: app
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-dev-release.apk
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          cat > build/app/outputs/flutter-apk/latest.json <<EOF
          {
            "app": "Omi Dev",
            "package": "com.friend.ios.dev",
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "sha256": "$SHA256",
            "sizeBytes": $SIZE,
            "apkUrl": "https://35.223.15.33.sslip.io/app/omi-dev-release.apk",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source": "${GITHUB_REPOSITORY} build-app run ${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}"
          }
          EOF
          cat build/app/outputs/flutter-apk/latest.json

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omi-dev-release-apk
          path: |
            app/build/app/outputs/flutter-apk/app-dev-release.apk
            app/build/app/outputs/flutter-apk/latest.json
          retention-days: 14
          if-no-files-found: error
