name: build-backend

# Builds the patched backend image (same image runs `backend` and `pusher`) and pushes it
# to GHCR. The VM then pulls it (pull-based deploy) — Actions never needs inbound access.
on:
  push:
    branches: [ selfhost ]
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: |
            PYTHON_BASE_IMAGE=python:3.11-slim
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cybervoid/omi-backend:latest
            ghcr.io/cybervoid/omi-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
